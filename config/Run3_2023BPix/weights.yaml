  PS_ISR:
    expression: weight_base_isr{scale}_rel * final_weight
    name: ps_isr_{}
  PS_FSR:
    expression: weight_base_fsr{scale}_rel * final_weight
    name: ps_fsr_{}

  # Theory uncertainties on the shapes: one weight per member (8 QCD-scale points, 103 PDF
  # members), reduced to Up/Down per bin by HistMergerFromHists once the datasets of a process
  # are summed (FLAF Common/TheoryUncertainties.py): the 7-point envelope, and the Hessian sum
  # with alpha_s. The members are normalised to their own total, so these are shape and
  # acceptance only; the rates stay with the inclusive QCD_scale_* / PDF_alphas lnN of the
  # datacards. Filled only for the fit inputs. One nuisance per process; both DY mass ranges
  # share one, and so do the mass points of a signal.
  qcd_scale:
    expression: weight_base_qcd_scale{scale}_rel * final_weight
    name: QCDscale_{process}_{}
    reduction: envelope
    variables: &theory_unc_variables [ "^DNN_m[0-9]+_vs_HME$" ]
    process_groups: &theory_unc_groups
      DY: [ DY_M_10to50, DY_M_50 ]
      GluGluToRadion_bbWW_2L: [ "^GluGluToRadion_bbWW_2L_[0-9]+$" ]
      GluGluToRadion_bbWW_1L: [ "^GluGluToRadion_bbWW_1L_[0-9]+$" ]
      GluGluToRadion_bbTauTau: [ "^GluGluToRadion_bbTauTau_[0-9]+$" ]
      GluGluToBulkGraviton_bbWW_2L: [ "^GluGluToBulkGraviton_bbWW_2L_[0-9]+$" ]
      GluGluToBulkGraviton_bbWW_1L: [ "^GluGluToBulkGraviton_bbWW_1L_[0-9]+$" ]
      GluGluToBulkGraviton_bbTauTau: [ "^GluGluToBulkGraviton_bbTauTau_[0-9]+$" ]
  pdf:
    expression: weight_base_pdf{scale}_rel * final_weight
    name: pdf_{process}_{}
    reduction: hessian
    variables: *theory_unc_variables
    process_groups: *theory_unc_groups

shape:
  JER:
    name: CMS_res_j_2023BPix_{}
  JES_Total:
    name: CMS_scale_j_2023BPix_{}
  EleES:
    name: CMS_scale_e_2023BPix_{}
  EleSmear:
    name: CMS_res_e_2023BPix_{}
  ScaRe:
    name: CMS_ScaRe_mu_2023BPix_{}
