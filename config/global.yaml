anaTupleDef: AnaProd/anaTupleDef.py
histTupleDef: Analysis/histTupleDef.py
analysis_import: Analysis.hh_bbww
analysis_cache_import: Analysis.tasks:AnalysisCacheTask:AnalysisCacheMergeTask
phys_model: Run3_Model

bundles:
  # Code and configuration: hashed, so that editing any of it produces a different bundle
  # instead of jobs silently running whatever was packed the first time.
  core:
    hashed: true
    patterns:
      - FLAF
      - AnaProd
      - Analysis
      - config
      - env.sh
      - Corrections
      - DeepHME
      - Studies
      - include
  # The installed environment: large, and only ever changes on a reinstall, so it is kept
  # out of the hashed bundle.
  soft:
    patterns:
      - soft/flaf_env
  cmssw:
    patterns:
      - soft/CMSSW_16_0_6
  inputFileList:
    patterns:
      - data/{version}/InputFileTask/{era}
    task_requires:
      module: FLAF.AnaProd.tasks
      class: InputFileTask
  AnaTupleFileList:
    patterns:
      - data/{version}/AnaTupleFileListBuilderTask/{era}
      - data/{version}/AnaTupleFileListTask/{era}
    # Both producers, or the bundle is packed as soon as the builder is done, while the
    # per-dataset lists of AnaTupleFileListTask are still being written.
    task_requires:
      - module: FLAF.AnaProd.tasks
        class: AnaTupleFileListBuilderTask
      - module: FLAF.AnaProd.tasks
        class: AnaTupleFileListTask
  inference:
    patterns:
      - inference
      - StatInference

WLCGFileSystem:
  remotePathCacheHost: cms-flaf.cern.ch
  remotePathCachePort: 5000
  localPathCacheValidity: 600
  verbose: 0

runTokenServer:
  host: cms-flaf.cern.ch
  port: 5007

nEventsPerFile:
  data: 1000000
  signals: 100000
  backgrounds: 100000

# The merged anaTuple keeps weight_base and weight_base_*_rel, which the histogram stage
# reads, plus weight_xs, weight_gen and weight_lumi. Each shape producer's members are only
# an input to building weight_base, so they are dropped here, named one by one: a new shape
# producer has to be added to this list, it is not swept up by a pattern.
anaTupleMerge_drop_columns:
  - "^weight_pu_"
  - "^weight_ps_"
  - "^weight_top_pt_"
  - "^weight_pdf_"
  - "^weight_qcd_scale_"

# Columns no systematic shift changes. They are stored in the central tree only, and an event
# selected only by a shift gets them from that shift, so its shifted-tree weight_base is its
# real weight (FuseAnaTuples checks that every variation selecting an event agrees). Generator-
# and event-level quantities only: generator information attached to a reconstructed object
# (lepN_gen_*, centralJet_matchedGenJet_*, *_hadronFlavour) follows the selected object and
# changes with the shift. HLT_* stays out: Analysis/hh_bbww.py defines every trigger column that
# GetColumnNames() does not list, and a column taken from the central tree is not listed there.
anaTuple_shift_invariant_columns:
  - "^(run|luminosityBlock|event)$"
  - "^(period|isData|X_mass|X_spin)$"
  - "^weight_(gen|lumi|xs|xs_ds)$"
  - "^weight_(pu|ps|pdf|qcd_scale|top_pt)_"
  - "^Pileup_nTrueInt$"
  - "^LHE_"
  - "^LHEPart_"
  - "^gen(HVV|Hbb|V[12]|V[12]prod[12]|b[12])_"
  - "^TTInfo_"
  - "^genTop_"

# Anchored: Run3_2024 and later inherit this block with `<<: *corrections_default` and override
# only the entries that differ there (btag, dy_hhbbtautau), so a correction added here reaches
# every era.
corrections: &corrections_default
  mu:
    stages: [ HistTuple, AnalysisCache ]
    columns:
      pfRelIso04_all: Muon_pfRelIso04_all
      tightId: Muon_tightId
      tkRelIso: Muon_tkRelIso
      highPtId: Muon_highPtId
      mediumId: Muon_mediumId
      looseId: Muon_looseId
  trigger:
    stages: [ HistTuple, AnalysisCache ]
    mode: SF
  ele: { stages: [ HistTuple, AnalysisCache ] }
  fatjet:
    stages: [ HistTuple, AnalysisCache ] # AnaTuple
    ana: bbWW
    tagger: particleNetWithMass_HbbvsQCD
    fatJetName: fatbjet # SelectedFatJet
  muScaRe: {
    stage: AnaTuple,
    mu_pt_for_ScaReApplication: "nano",
    selection: "Muon_looseId",
  }
  eleES: { stages: [ AnaTuple, AnalysisCache ] }
  lumi: { stage: AnaTuple }
  xs: { stage: AnaTuple }
  gen: { stage: AnaTuple }
  pu:
    stages: [ AnaTuple, AnaTupleMerge ]
  parton_shower:
    stages: [ AnaTuple, AnaTupleMerge ]
    branch: PSWeight
  base: { stage: AnaTupleMerge }
  JEC: { stage: AnaTuple }
  JER:
    stage: AnaTuple
    apply_jet_horns_fix: true
  btag:
    normCacheProducer: BtagShape
    stages: [ AnaTuple, HistTuple, AnalysisCache ]
    modes:
      AnaTuple: none # just load to define WP ID branches
      AnalysisCache: shape
      HistTuple: shape_and_norm
    tagger: particleNet
    jetCollection: centralJet
  # dy_hhbbww:
  #   stages: [ AnalysisCache, HistTuple ]
  #   processes: [ DY_M_10to50, DYto2L_InclusivePlusBinned ]
  #   njets_branch: Njets # Use nCentralJets, not raw nJet
  #   pt_ll: ll_pt
  dy_hhbbtautau:
    stages: [ AnalysisCache, HistTuple ]
    processes: [ DY_M_10to50, DYto2L_InclusivePlusBinned, custom_CI_Background_DY ]
    njets_branch: Njets # Use nCentralJets, not raw nJet
    ntags_branch: nBTaggedJets
    pt_ll_gen: ll_pt_gen
  top_pt:
    stages: [ AnaTuple, AnaTupleMerge ]
    processes: [ TT, custom_CI_Background_TT ]
    branch: genTop_pt
    parameterization: data_nlo
  pdf:
    stages: [ AnaTuple, AnaTupleMerge ]
    branch: LHEPdfWeight
    n_members: 103
  qcd_scale:
    stages: [ AnaTuple, AnaTupleMerge ]
    branch: LHEScaleWeight
