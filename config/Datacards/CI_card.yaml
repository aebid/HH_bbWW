analysis: hh_bbww
type: resonant
model:
  parameters: [ MX ]
  param_dependent_bkg: true
  input_file_pattern: ${ERA}/DNN_m${MX}_vs_HME/DNN_m${MX}_vs_HME.root
signalFractionForRelevantBins: 0.2
eras:
  - Run3_2022
  - Run3_2022EE
  - Run3_2023
  - Run3_2023BPix
channels:
  - muMu
  - eMu
  - eE
categories:
  - OS_Iso/res2b
  - OS_Iso/recovery

# The CI runs with --test, i.e. --nEvents 1000 per dataset, so every yield is ~1e-3 of
# nominal. The production gates (min_signal 0.5, min_dnn_bkg_sum 1.0, the N_eff floors)
# would drop every category before a single shape was written, so they are all off here
# and the rebinning collapses to one DNN slice with one mass bin -- enough to exercise
# the chain end to end without asking a thousand events to support a real binning.
binning:
  n_dnn_slices: 1
  max_mass_bins: 1
  min_dnn_bkg_sum: 0.0
  min_mass_bkg_each: 0.0
  min_signal: 0.0
  min_bkg_neff: 0.0
  min_bkg_frac: 0.0
  min_mass_bkg_neff: 0.0
  bkg_per_mass_bin: 0.0
  significance_mode: asimov
processes:
  - process: data_obs
    is_data: true
    is_asimov_data: true
  - process: XtoHHto2B2W_2L_${MX} # GluGluToRadion2L_${MX}
    hist_name: XtoHHto2B2W_2L_${MX} # GluGluToRadion2L_${MX}
    param_values: [ 300 ]
    is_signal: true
  - custom_CI_Background
uncertainties:
  # Split per year rather than per era: the luminosity calibration is a per-year
  # measurement, so 2022 and 2022EE share a nuisance and 2023 and 2023BPix share
  # another. This is lnN, so it needs nothing from the producer -- the meta-era lnN
  # path already evaluates `eras:` against the sub-eras.
  #
  # NOTE: both magnitudes are still the old flat 1.4%. Only the correlation model has
  # been fixed here; the per-year values need to be taken from the current LUM
  # recommendation (which also splits a correlated from an uncorrelated component,
  # not implemented here).
  - name: lumi_13p6TeV_2022
    type: lnN
    eras:
      - Run3_2022
      - Run3_2022EE
    value: 0.014 # https://twiki.cern.ch/twiki/bin/view/CMS/LumiRecommendationsRun3
  - name: lumi_13p6TeV_2023
    type: lnN
    eras:
      - Run3_2023
      - Run3_2023BPix
    value: 0.014 # TODO: per-year LUM value


  - name: CMS_eff_m_id_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_eff_m_id_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_eff_m_id_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_eff_m_id_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_eff_m_id_iso_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_eff_m_id_iso_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_eff_m_id_iso_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_eff_m_id_iso_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: EleID_TightIDIso_2022
    type: shape
    eras:
      - Run3_2022
  - name: EleID_TightIDIso_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: EleID_TightIDIso_2023
    type: shape
    eras:
      - Run3_2023
  - name: EleID_TightIDIso_2023BPix
    type: shape
    eras:
      - Run3_2023BPix

  - name: SingleEleTrg_2022
    type: shape
    eras:
      - Run3_2022
  - name: SingleEleTrg_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: SingleEleTrg_2023
    type: shape
    eras:
      - Run3_2023
  - name: SingleEleTrg_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: SingleMuonTrg_2022
    type: shape
    eras:
      - Run3_2022
  - name: SingleMuonTrg_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: SingleMuonTrg_2023
    type: shape
    eras:
      - Run3_2023
  - name: SingleMuonTrg_2023BPix
    type: shape
    eras:
      - Run3_2023BPix

  # Decorrelated per era: the pileup profile and the minimum-bias cross section
  # are derived per era. The era suffix is produced by config/Run3_<era>/weights.yaml
  # -- the nuisance name is also the histogram name, so it cannot be added here.
  - name: CMS_pileup_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_pileup_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_pileup_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_pileup_2023BPix
    type: shape
    eras:
      - Run3_2023BPix

  # BTV shape calibration, registered in config/Run3_*/weights.yaml. Correlated
  # across the four Run 3 eras -- the BTV per-era split of the *stats* sources needs
  # meta-era support that dc_make does not have yet (see docs/stat_inference.md).
  # In boosted categories the variation is neutralised at weight level, so these are
  # dropped there automatically by the canIgnore threshold.
  - name: CMS_btag_LF
    type: shape
  - name: CMS_btag_HF
    type: shape
  - name: CMS_btag_lfstats1_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_btag_lfstats1_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_btag_lfstats1_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_btag_lfstats1_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_btag_lfstats2_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_btag_lfstats2_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_btag_lfstats2_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_btag_lfstats2_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_btag_hfstats1_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_btag_hfstats1_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_btag_hfstats1_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_btag_hfstats1_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_btag_hfstats2_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_btag_hfstats2_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_btag_hfstats2_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_btag_hfstats2_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_btag_cferr1
    type: shape
  - name: CMS_btag_cferr2
    type: shape

  # AK8 calibration, registered in config/Run3_*/weights.yaml. Neutralised at
  # weight level for resolved events, so canIgnore drops these outside boosted.
  # Decorrelated: Corrections/fatjet.py loads one of four separate calibration files,
  # so these are four independent fits.
  - name: CMS_bbww_ak8_Hbb_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_bbww_ak8_Hbb_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_bbww_ak8_Hbb_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_bbww_ak8_Hbb_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_bbww_ak8_Hcc_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_bbww_ak8_Hcc_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_bbww_ak8_Hcc_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_bbww_ak8_Hcc_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_bbww_ak8_tau21_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_bbww_ak8_tau21_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_bbww_ak8_tau21_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_bbww_ak8_tau21_2023BPix
    type: shape
    eras:
      - Run3_2023BPix

  - name: CMS_scale_j
    type: shape
  # JER is measured per era, so it is decorrelated -- one source, one measurement
  # per era, no ambiguity.
  #
  # JES (CMS_scale_j above) is the one source left correlated, and not because the
  # question is open: `Total` is the quadrature sum of a family that JME prescribes
  # be correlated (FlavorQCD, RelativeBal, HF, BBEC1, EC2, Absolute) and a per-year
  # family (BBEC1_, Absolute_, EC2_, HF_, RelativeSample_ -- Corrections/jet.py).
  # Whichever correlation is assigned to Total, one family is wrong: correlating it
  # lets the fit constrain the year-dependent pieces coherently across four eras,
  # decorrelating it averages FlavorQCD down as if it were four measurements. It is
  # kept correlated because FlavorQCD dominates for a bb final state and diluting it
  # is the worse error. The real fix is switching JetCorrProducer to the regrouped
  # sources -- note `use_regrouped` is never passed (Corrections/Corrections.py), so
  # that needs a code change and a full anaTuple re-production, not a config flip.
  - name: CMS_res_j_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_res_j_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_res_j_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_res_j_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_scale_e_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_scale_e_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_scale_e_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_scale_e_2023BPix
    type: shape
    eras:
      - Run3_2023BPix


autolnNThr: 0.1
asymlnNThr: 0.001
ignorelnNThr: 0.001
autoMCStats:
  apply: true
  threshold: 20
  apply_to_signal: true
  mode: 1
