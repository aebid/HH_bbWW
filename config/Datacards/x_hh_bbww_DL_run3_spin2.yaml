# DL resonant datacards, spin-2 (bulk graviton): the spin-0 card x_hh_bbww_DL_run3.yaml with the
# graviton signal. Everything else (categories, backgrounds, uncertainties, preprocess, plots) is
# that card's. Selected by
#   StatInference: { config: config/Datacards/x_hh_bbww_DL_run3_spin2.yaml }
# in a user_custom (global.yaml points at the spin-0 card).
extends: x_hh_bbww_DL_run3.yaml
variables:
  SIGNAL_MODEL: GluGluToBulkGraviton
  SPIN: 2
  SPIN_NAME: graviton
