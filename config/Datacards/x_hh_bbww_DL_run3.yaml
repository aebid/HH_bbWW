analysis: hh_bbww
type: resonant
model:
  parameters: [ MX ]
  param_dependent_bkg: true
  input_file_pattern: ${ERA}/DNN_m${MX}_vs_HME/DNN_m${MX}_vs_HME.root
signalFractionForRelevantBins: 0.2
eras:
  - Run3_2022
  - Run3_2022EE
  - Run3_2023
  - Run3_2023BPix
  - Run3_Early
era_groups:
  Run3_Early:
    - Run3_2022
    - Run3_2022EE
    - Run3_2023
    - Run3_2023BPix
channels:
  - muMu
  - eMu
  - eE
categories:
  - SR/res2b
  - SR/boosted
  - SR/recovery

# Rebinning configuration done inside HistRebinTask
binning:
  n_dnn_slices: 4
  max_mass_bins: 10
  min_dnn_bkg_sum: 1.0
  min_mass_bkg_each: 0.01
  min_signal: 0.5

  # Minimum effective MC entries of summed background for a DNN slice
  min_bkg_neff: 4.0
  # Backgrounds below this fraction of the total are skipped in the min_mass_bkg_each check
  min_bkg_frac: 0.05

  # Minimum effective MC entries of summed background for a mass bin
  min_mass_bkg_neff: 4.0
  # Total summed background for each mass bin if possible, overrides max_mass_bins
  bkg_per_mass_bin: 5.0
  significance_mode: asimov

  # Minimum yield on each background in a DNN slice, if it is above min_bkg_frac of the total
  min_dnn_bkg_each: 0.01
  # Minimum yield on each background in a DNN slice (yield instead of just positive)
  min_dnn_bkg_neff: 0.0

processes:
  - process: data_obs
    is_data: true
    is_asimov_data: true

  - process: XtoHHto2B2W_2L_${MX} # GluGluToRadion2L_${MX}
    hist_name: XtoHHto2B2W_2L_${MX} # GluGluToRadion2L_${MX}
    param_values: [ 300, 400, 500, 550, 600, 650, 700, 800, 900, 1000 ]
    is_signal: true
    allow_zero_integral: true

  - process: XtoHHto2Tau2B_${MX}
    hist_name: XtoHHto2Tau2B_${MX}
    param_values: [ 300, 400, 500, 550, 600, 650, 700, 800, 900, 1000 ]
    is_signal: true
    allow_zero_integral: true
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2

  - process: TT
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2

  - process: DY
    channels:
      - eE
      - muMu
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2

  - process: VV
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
    allow_zero_integral: true

  - process: ST
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2

  # Merged background template for boosted slices as MC yield is extremely low
  - process: TotalBkg
    subprocesses:
      - TT
      - DY
      - ST
      - VV
    categories:
      - SR/boosted

  # - W
  # - Other

uncertainties:
  # Luminosity, as the Run 3 recommendation splits it: one component correlated across
  # all four eras but with a different size in each year group, and a second carried by
  # 2023 alone. Not a per-year uncorrelated pair -- that would treat the two year groups
  # as independent, which they are not.
  #
  # lumi_1 is one nuisance whose value depends on the era. Under a meta-era the datacard
  # maker cannot express that as a single lnN on the summed yield, so it builds the
  # variation sub-era by sub-era and writes it as a shape; each sub-era contributes its
  # own factor, and the ratio to nominal comes out as the yield-weighted blend.
  #
  # Reference: https://twiki.cern.ch/twiki/bin/viewauth/CMS/LumiRecommendationsRun3?extralog=-%20caching%20topic#Correlations_between_years_and_c
  - name: lumi_1_13p6TeV
    hasMultipleValues: True
    type: lnN
    value:
      - value: 0.0138
        type: lnN
        eras:
          - Run3_2022
          - Run3_2022EE
      - value: 0.0017
        type: lnN
        eras:
          - Run3_2023
          - Run3_2023BPix
  - name: lumi_2_13p6TeV
    type: lnN
    eras:
      - Run3_2023
      - Run3_2023BPix
    value: 0.0127

