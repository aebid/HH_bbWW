  # For multiple values, Konstantin says do [ down, up ]
  - name: QCD_scale_TT
    type: lnN
    processes:
      - TT
    value: [ -0.036, 0.025 ] # TT XS uncertainty in percentage from xsec yaml
    # TT:
    # crossSec: '923.6'
    # reference: https://twiki.cern.ch/twiki/bin/view/LHCPhysics/TtbarNNLO#Updated_reference_cross_sections
    # unc: +22.6 -33.4 (scale) +/-  22.8 (PDF alphas) -24.6 +25.4 (mass) (to be multiplied by the BR)

  - name: QCD_scale_DY
    type: lnN
    processes:
      - DY
    value: [ -0.011, 0.007 ] # DY XS uncertainty in percentage from xsec yaml
    # DY_NNLO_QCD+NLO_EW:
    # crossSec: 2094.2 * 3
    # reference: https://twiki.cern.ch/twiki/bin/viewauth/CMS/MATRIXCrossSectionsat13p6TeV
    # unc: +0.7% - 1.1%, +- 1.0% PDF alphas

  - name: QCD_scale_ST
    type: lnN
    processes:
      - ST
    value: [ -0.022, +0.022 ]
    # Taken from ST to tW (largest uncertainty on XS) needs to be updated for each decay process later

  - name: QCD_scale_VV
    type: lnN
    processes:
      - VV
    # WARNING: this is not a QCD scale uncertainty. XSDB's `unc` field is an absolute
    # uncertainty in pb on its own Monte-Carlo integration, and 0.005 is just that
    # number divided by the cross section (WW 0.3733/80.23 = 0.47%, WZ 0.1318/29.1 =
    # 0.45%, ZZ 0.0649/12.75 = 0.51%; FLAF/config/crossSections13p6TeV.yaml:1051-1209).
    # The real NNLO diboson scale uncertainty is several percent. Needs replacing with a
    # number from the diboson theory reference; left as-is rather than guessed.
    value: 0.005

  - name: PDF_alphas
    hasMultipleValues: True
    type: lnN
    value:
      - value: 0.025
        type: lnN
        processes:
          - TT
      - value: 0.01
        type: lnN
        processes:
          - DY
      - value: 0.027
        type: lnN
        processes:
          - ST

  - name: top_mass
    hasMultipleValues: True
    type: lnN
    value:
      - value: [ -0.027, 0.028 ]
        type: lnN
        processes:
          - TT
      - value: [ -0.015, 0.015 ] # Taken from tW for now (largest unc percentage)
        type: lnN
        processes:
          - ST

  # Higgs branching ratios: theory, so correlated across every era -- no `eras:` field,
  # which is what makes them apply everywhere. Values from
  # https://gitlab.cern.ch/hh/naming-conventions#experimental-uncertainties
  #
  # XtoHHto2B2W_1L is the single-lepton signal and is not a process of this dilepton
  # card; it belongs in these lists when the SL card gains them. Single Higgs and VH
  # likewise, once they are added as processes.
  #
  # The process patterns are regexes (a `processes:` entry beginning with ^ is matched
  # with re.match, anything else compared literally). They have to be: by the time an
  # uncertainty is matched, the signal's ${MX} has been resolved to the mass being built,
  # so the process is XtoHHto2B2W_2L_700 and a literal "XtoHHto2B2W_2L_${MX}" matches
  # nothing at all -- silently, since an uncertainty that applies to no process is simply
  # never added.
  - name: BR_hbb
    type: lnN
    processes:
      - ^XtoHHto2B2W_2L_
      - ^XtoHHto2Tau2B_
    value: [ -0.0126, 0.0124 ]
  - name: BR_hww
    type: lnN
    processes:
      - ^XtoHHto2B2W_2L_
    value: [ -0.0152, 0.0153 ]
  - name: BR_htt
    type: lnN
    processes:
      - ^XtoHHto2Tau2B_
    value: [ -0.0163, 0.0165 ]

autolnNThr: 0.1
asymlnNThr: 0.001
ignorelnNThr: 0.001
autoMCStats:
  apply: true
  threshold: 20
  apply_to_signal: true
  mode: 1

campaigns:
  Run3_Early: run3_early
  Run3_2022: "2022preEE"
  Run3_2022EE: "2022postEE"
  Run3_2023: "2023preBPix"
  Run3_2023BPix: "2023postBPix"

limit_plots:
  - name: run3_vs_run2
    # Draw 1/2 sigma bands
    bands: true
    datacards:
      - { name: "Early Run 3", glob: "*.txt" }
    lumi_projections:
      - name: "Early Run 3 scaled to 138 fb^{-1}"
        lumi_target: 138
    external_limits:
      - config/Datacards/run2_spin0_DL_external_limits.json
    plot_params: &limit_plot_style
      xsec: pb
      y_log: true
      x_min: 200
      x_max: 1000
      y_min: 0.001
      y_max: 100

  - name: channels
    datacards:
      - { name: "Combined", glob: "*.txt" }
      - { name: "ee", glob: "${ERA}/eE/*.txt" }
      - { name: "e#mu", glob: "${ERA}/eMu/*.txt" }
      - { name: "#mu#mu", glob: "${ERA}/muMu/*.txt" }
    external_limits:
      - config/Datacards/run2_spin0_DL_external_limits.json
    plot_params: *limit_plot_style

  - name: categories
    datacards:
      - { name: "Combined", glob: "*.txt" }
      - { name: "res 2b", glob: "${ERA}/categories/SR_res2b/*.txt" }
      - { name: "recovery", glob: "${ERA}/categories/SR_recovery/*.txt" }
      - { name: "boosted", glob: "${ERA}/categories/SR_boosted/*.txt" }
    external_limits:
      - config/Datacards/run2_spin0_DL_external_limits.json
    plot_params: *limit_plot_style
