page_setup:
  canvas_size: [ 700, 700 ]
  main_pad: [ 0.02, 0.25, 0.95, 0.94 ]
  margins: [ 0.18, 0.14, 0.02, 0.02 ]
  paper_size: [ 20, 20 ]
  canvas_color: kWhite
  canvas_border_size: 10
  canvas_border_mode: 0
  palette: 1
  end_error_size: 0
  grid_xy: [ false, false ]
  tick_xy: [ false, false ]
  tick_length_xy: [ 0.03, 0.03 ]
  n_div_xy: [ 510, 510 ]
  y_min: 0
  y_min_log: 1e-2
  axis_title_sizes: [ 0.055, 0.055 ]
  axis_title_offsets: [ 0.8, 1.4 ]
  axis_label_sizes: [ 0.04, 0.04 ]
  axis_label_offsets: [ 0.005, 0.005 ]
  draw_ratio: true
  ratio_y_title: "Obs/Bkg"
  ratio_y_title_size: 0.055
  ratio_y_title_offset: 0.4
  ratio_y_label_size: 0.04
  ratio_y_label_offset: 0.005
  ratio_n_div_y: 505
  max_ratio: 1.5
  allowed_ratio_margin: 0.5
  ratio_pad_size: 0.25
  ratio_pad_spacing: 0.04
  # log y: this fraction of the axis height stays free above the highest bin, for the legend
  log_y_headroom: 0.45
  # linear y: the same, instead of the per-variable max_y_sf
  y_headroom: 0.4
  # the CMS / scope / lumi line, small enough for "Simulation Preliminary" beside the lumi
  cms_label_fontsize: 20
  text_boxes:
    - cms_text
    - scope_text
    - datasim_text
    - lumi_text
    - ana_text
    - cat_text
    - ch_text
    - customreg_text
  # The labels top left, a line per entry: the channel and the category share one. Each line
  # takes the text_size and font (62: bold) of its first box.
  label_lines:
    - [ ana_text ]
    - [ ch_text, cat_text ]
    - [ customreg_text ]
  legend: legend

legend:
  pos_ref: inner_right_top
  pos: [ 0.4, 0.44 ]
  size: [ 0.56, 0.42 ]
  fill_color: kWhite
  fill_style: 0
  border_size: 0
  text_size: 0.017
  font: 42
  n_columns: 2

ana_text:
  text: "hh#rightarrowbbWW"
  pos_ref: inner_left_top
  pos: [ 0.1, -0.02 ]
  text_size: 0.03
  font: 62
  align: left_bottom

cms_text:
  text: "CMS"
  pos_ref: inner_left_top
  pos: [ -0.01, -0.07 ]
  text_size: 0.035
  font: 61

scope_text:
  text: "Preliminary"
  pos_ref: cms_text
  pos: [ 0.05, -0.08 ]
  text_size: 0.04
  font: 52

datasim_text:
  pos_ref: scope_text
  pos: [ 0, 0 ]
  text_size: 0.04
  font: 52

cat_text:
  pos_ref: datasim_text
  pos: [ 0.1, -0.08 ]
  text_size: 0.03
  font: 62

ch_text:
  pos_ref: datasim_text
  pos: [ 0.01, -0.08 ]
  text_size: 0.03
  font: 62

customreg_text:
  pos_ref: datasim_text
  pos: [ 0.24, -0.08 ]
  text_size: 0.03
  font: 62

bkg_hist:
  fill_style: 1001
  line_style: 1
  line_width: 1
  line_color: kBlack
  legend_style: F
  draw_opt: HIST
  unc_hist: bkg_unc_hist

bkg_unc_hist:
  fill_style: 3013
  fill_color: kCyan-5
  line_width: 0
  legend_title: "Bkg. uncertainty"
  legend_style: f
  draw_opt: e2
  # Used only when the plot is made with --compute_unc_histograms, i.e. when the full
  # (stat + syst) uncertainty is available and two nested bands are drawn: the outer
  # (total) band switches to the sparser diagonal hatch and the inner, stat-only band
  # takes the denser cross-hatch, which keeps the narrower band readable.
  legend_title_full: "Bkg. unc. (stat + syst)"
  fill_style_full: 3004
  stat_fill_style: 3013
  stat_fill_color: kGray+2
  stat_legend_title: "Bkg. stat. unc."

sgn_hist:
  fill_style: 1001
  fill_color: kWhite
  line_style: 2
  line_width: 3
  legend_style: F
  draw_opt: HIST
  # true adds each signal's yield to its legend entry (internal studies)
  show_yield: false
  # with signal_plot_scale: bkg, said once in the legend instead of on every signal
  norm_legend_note: "Signals normalised to the total background"

data_hist:
  fill_style: 0
  line_style: 1
  line_width: 2
  line_color: kBlack
  marker_style: 20
  marker_size: 1.1
  marker_color: kBlack
  legend_style: PLE
  draw_opt: "0pe"
  blind: true
