storage_folder: /eos/user/d/daebi/HH_bbWW/v2605a_DNNTraining/HistTuples/*/ # Include all eras with *

nParity: 4

# Cuts for RDF in creating the training file
iterate_cut: (
  (SR == 1) &&
  (boosted == 1) &&
  ( (channelId == 11) || (channelId == 12) || (channelId == 22) )
  ) &&
  ( ll_mass < 70 )
parity_cut: (
  (event%{nParity} == {parity_scan})
  )

